version: '3.9'

services:
  healthai:
    build: .
    container_name: healthai_app
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./ml_models:/app/ml_models
      - ./health_ai.db:/app/health_ai.db
    environment:
      - SECRET_KEY=change-this-in-production-use-random-256-bit-key
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
